insert = r'''function makeKayKitActor(asset, index) {
  const loaded = asset ? kayKitAssets.get(asset.id) : null;
  if (!loaded?.scene) return null;
  const root = new THREE.Group();
  root.name = asset.id + '-actor-' + index;
  const model = SkeletonUtils.clone(loaded.scene);
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  const height = Math.max(0.001, size.y);
  const scale = 2.9 / height;
  model.scale.setScalar(scale);
  model.position.x -= center.x * scale;
  model.position.z -= center.z * scale;
  model.position.y -= box.min.y * scale;
  model.traverse((node) => {
    if (!node.isMesh) return;
    node.castShadow = true;
    node.receiveShadow = true;
    node.userData.sharedAsset = true;
  });
  root.add(model);
  const mixer = new THREE.AnimationMixer(model);
  root.userData = {
    imported: true,
    kaykit: true,
    model,
    mixer,
    clips: loaded.clips,
    activeAction: null,
    activeClip: '',
    phase: index * 0.73,
    headBone: findBone(model, ['head', 'neck', 'mixamorighead']),
  };
  return root;
}

function requestKayKitAsset(asset) {
  if (!asset?.id) return;
  loadKayKitCharacter(asset)
    .then(() => {
      if (typeof window !== 'undefined') window.dispatchEvent(new Event('agon-three-assets-ready'));
    })
    .catch(() => {
      if (typeof window !== 'undefined') window.dispatchEvent(new Event('agon-three-assets-error'));
    });
}

function requestEnvironmentAsset(asset) {
