name: Agon asset expansion

on:
  push:
    paths:
      - ".github/workflows/asset-expansion.yml"

permissions:
  contents: write

jobs:
  expand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Apply asset expansion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          registry = r'''export type AssetKind = 'character' | 'environment-prop' | 'source';

export interface ExternalAsset {
  id: string;
  label: string;
  kind: AssetKind;
  source: string;
  sourceUrl: string;
  license: string;
  modelUrl?: string;
  roles: string[];
}

