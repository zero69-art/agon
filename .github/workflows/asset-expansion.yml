export function findKayKitCharacter(label: string | undefined, index = 0): ExternalAsset {
  const text = String(label || '').toLowerCase();
  const direct = KAYKIT_CHARACTERS.find((asset) => asset.roles.some((role) => new RegExp('\\b' + role + '\\b', 'i').test(text)));
  return direct || KAYKIT_CHARACTERS[index % KAYKIT_CHARACTERS.length];
}

export function environmentPropsFor(motif: string): ExternalAsset[] {
  const text = String(motif || '').toLowerCase();
  return QUATERNIUS_ENVIRONMENT_PROPS.filter((asset) => asset.roles.some((role) => new RegExp('\\b' + role + '\\b', 'i').test(text))).slice(0, 3);
}

export function allCharacterAssets(): ExternalAsset[] {
  return [...KAYKIT_CHARACTERS];
}

export function allEnvironmentAssets(): ExternalAsset[] {
  return [...QUATERNIUS_ENVIRONMENT_PROPS];
}
