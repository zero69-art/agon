replacement = anchor + r'''
async function loadKayKitCharacter(asset) {
  if (!asset?.id || !asset.modelUrl) return null;
  if (kayKitAssets.has(asset.id)) return kayKitAssets.get(asset.id);
  if (kayKitPromises.has(asset.id)) return kayKitPromises.get(asset.id);
  const loader = new GLTFLoader();
  const promise = loader.loadAsync(asset.modelUrl)
    .then((gltf) => {
      const loaded = { scene: gltf.scene, clips: gltf.animations || [], asset };
      kayKitAssets.set(asset.id, loaded);
      kayKitPromises.delete(asset.id);
      return loaded;
    })
    .catch((error) => {
      kayKitPromises.delete(asset.id);
      throw error;
    });
  kayKitPromises.set(asset.id, promise);
  return promise;
}

async function loadEnvironmentAsset(asset) {
  if (!asset?.id || !asset.modelUrl) return null;
  if (environmentAssets.has(asset.id)) return environmentAssets.get(asset.id);
  if (environmentPromises.has(asset.id)) return environmentPromises.get(asset.id);
  const loader = new GLTFLoader();
  const promise = loader.loadAsync(asset.modelUrl)
    .then((gltf) => {
      const loaded = { scene: gltf.scene, asset };
      environmentAssets.set(asset.id, loaded);
      environmentPromises.delete(asset.id);
      return loaded;
    })
    .catch((error) => {
      environmentPromises.delete(asset.id);
      throw error;
    });
  environmentPromises.set(asset.id, promise);
  return promise;
}

async function preloadThreeAssets(project) {
  const tasks = [loadQuaterniusAssets()];
  const scenes = project?.scenes || [];
  for (const scene of scenes) {
    const labels = Array.isArray(scene?.characters) ? scene.characters : [];
    if ((scene?.asset || 'auto') === 'kaykit') {
      labels.slice(0, 2).forEach((label, index) => tasks.push(loadKayKitCharacter(findKayKitCharacter(label, index))));
    } else if ((scene?.asset || 'auto') !== 'procedural') {
      labels.slice(0, 2).forEach((label, index) => {
        if (KAYKIT_CHARACTERS.some((asset) => asset.roles.some((role) => new RegExp('\\b' + role + '\\b', 'i').test(String(label || ''))))) {
          tasks.push(loadKayKitCharacter(findKayKitCharacter(label, index)));
        }
      });
    }
    environmentPropsFor(scene?.motif || 'none').forEach((asset) => tasks.push(loadEnvironmentAsset(asset)));
  }
  await Promise.allSettled(tasks);
  return true;
}
'''
