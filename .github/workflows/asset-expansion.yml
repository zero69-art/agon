# Generic clip picker: preserves existing Quaternius candidates and adds flexible KayKit matching.
old_picker = """function pickQuaterniusClip(action) {
  const clips = quaterniusAssets?.clips || [];
  const candidates = QUATERNIUS_CLIP_CANDIDATES[action] || QUATERNIUS_CLIP_CANDIDATES.idle;
  const normalize = (value) => String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const names = candidates.map(normalize);
  return clips.find((clip) => {
    const n = normalize(clip.name);
    return names.some((candidate) => n === candidate || n.includes(candidate) || candidate.includes(n));
  }) || clips[0] || null;
}
"""
new_picker = r'''function pickImportedClip(clips, action) {
  const candidates = QUATERNIUS_CLIP_CANDIDATES[action] || QUATERNIUS_CLIP_CANDIDATES.idle;
  const normalize = (value) => String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const names = candidates.map(normalize);
  const flexible = {
    idle: ['idle', 'breath', 'stand'],
    walk: ['walk', 'walking', 'jog', 'locomotion'],
    run: ['run', 'sprint', 'jog'],
    jump: ['jump', 'leap', 'hop'],
    wave: ['wave', 'greet', 'hello'],
    fight: ['attack', 'punch', 'slash', 'sword', 'hit', 'combat', 'shoot'],
    dance: ['dance', 'emote'],
    sit: ['sit', 'sitting'],
    point: ['point', 'pointing'],
    look: ['look', 'idle'],
    kneel: ['kneel', 'kneeling'],
    reach: ['interact', 'pickup', 'pick', 'reach', 'grab'],
    talk: ['talk', 'speak', 'conversation', 'chat'],
  }[action] || ['idle'];
  const clipsList = clips || [];
  return clipsList.find((clip) => {
    const n = normalize(clip.name);
    return names.some((candidate) => n === candidate || n.includes(candidate) || candidate.includes(n));
  })
    || clipsList.find((clip) => {
      const n = normalize(clip.name);
      return flexible.some((candidate) => n.includes(normalize(candidate)));
    })
    || clipsList[0]
    || null;
}

function pickQuaterniusClip(action) {
  return pickImportedClip(quaterniusAssets?.clips || [], action);
}
'''
