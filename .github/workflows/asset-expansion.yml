## Expanded free movie asset pipeline

Agon now has a license-aware external asset registry and a multi-pack character path:

- **Quaternius** — CC0 characters, Universal Animation Library, nature, villages, RPG, sci-fi and space packs.
- **KayKit / Kay Lousberg** — CC0 character variants and animation-ready GLB characters.
- **Kenney** — CC0 characters, animals, vehicles, environments, props and audio.
- **Poly Haven** — CC0 HDRIs, PBR materials, textures and models.
- **OpenGameArt CC0 collections** — selected CC0 characters, creatures, buildings, props and audio.

Runtime character assets are loaded as GLB files over HTTPS and cached for the current browser session. Auto asset routing uses Quaternius for general human roles and KayKit for specialist roles such as wizards, archers, rogues, knights and undead. A procedural actor remains the fallback when an external asset is unavailable.

Official source/licence references:
- https://quaternius.com/
- https://kaylousberg.itch.io/
- https://kenney.nl/assets
- https://polyhaven.com/license
