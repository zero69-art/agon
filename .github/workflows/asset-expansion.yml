      makeSceneActor(s1, 1, requestedLabels[1] || ''),
    ];
"""
new_block = """    const assetMode = currentScene?.asset || 'auto';
    const requestedLabels = [requested[0], requested[1]];
    const wantsKayKit = (label, index) =>
      assetMode === 'kaykit' ||
      (assetMode === 'auto' && KAYKIT_CHARACTERS.some((asset) => asset.roles.some((role) => new RegExp('\\b' + role + '\\b', 'i').test(String(label || '')))));
    const useQuaternius = (species, label, index) =>
      assetMode !== 'procedural' &&
      !wantsKayKit(label, index) &&
      (assetMode === 'quaternius' || species === 'human' || isQuaterniusCharacterLabel(label));
    const makeSceneActor = (species, index, label) => {
      if (wantsKayKit(label, index)) {
        const imported = makeKayKitActor(findKayKitCharacter(label, index), index);
        if (imported) return imported;
        requestKayKitAsset(findKayKitCharacter(label, index));
      }
      if (useQuaternius(species, label, index)) {
        const imported = makeQuaterniusActor(index);
        if (imported) return imported;
      }
      return makeActor(THREE, species, index, paletteIndex);
    };

    actors = [
      makeSceneActor(s0, 0, requestedLabels[0] || ''),
      makeSceneActor(s1, 1, requestedLabels[1] || ''),
    ];

    environmentPropsFor(motif).forEach((asset, propIndex) => {
      const loaded = environmentAssets.get(asset.id);
      if (!loaded?.scene) {
        requestEnvironmentAsset(asset);
        return;
      }
      const prop = SkeletonUtils.clone(loaded.scene);
      prop.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = true;
        node.receiveShadow = true;
        node.userData.sharedAsset = true;
      });
      const scale = motif === 'forest' ? 1.1 + propIndex * 0.12 : 1.5 + propIndex * 0.2;
      prop.scale.setScalar(scale);
      prop.position.set(-6 + propIndex * 6.0, 0, -4.5 - (propIndex % 2) * 1.4);
      environment.add(prop);
    });
"""
if old_block not in s:
    raise SystemExit("rebuild actor block not found")
s = s.replace(old_block, new_block)

# Use imported animation for both Quaternius and KayKit.
s = s.replace("      if (actor.userData.quaternius) animateQuaterniusActor(actor, index, action, globalTime, speakingIndex, emotion);", "      if (actor.userData.quaternius || actor.userData.kaykit) animateQuaterniusActor(actor, index, action, globalTime, speakingIndex, emotion);")

# Initial preload should not load every KayKit character, only Quaternius and then lazy-load by scene.
# Replace global preload hook with project-aware version.
s = s.replace("  window.__AGON_PRELOAD_THREE_ASSETS__ = loadQuaterniusAssets;", "  window.__AGON_PRELOAD_THREE_ASSETS__ = preloadThreeAssets;")

p.write_text(s, encoding="utf-8")
